name: elif_ders_programi
description: "Elif'in Sınav Koçu — Kişisel sınav hazırlık ve ders programı uygulaması"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  fl_chart: ^0.70.2
  shared_preferences: ^2.3.4
  google_fonts: ^6.2.1
  provider: ^6.1.2
  intl: ^0.19.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.jpg"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/app_icon.jpg"
  android_12:
    image: "assets/images/app_icon.jpg"
    icon_background_color: "#FFFFFF"
